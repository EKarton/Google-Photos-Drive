<nb-layout>
  @let isLoading = (isLoading$ | async) ?? false;

  <nb-layout-header [fixed]="true">
    <app-header class="content-page__header" [isLoading]="isLoading" />
  </nb-layout-header>
  <mat-progress-bar mode="query"></mat-progress-bar>
  <nb-layout-column>
    @if (path) {
    <app-path-breadcrumbs class="content-page__breadcrumbs" [path]="path" />
    } @if (treeNode && treeNode.childNodes.length > 0) {
    <app-albums-section [albums]="treeNode.childNodes" [path]="path" />
    } @else if (isLoading) { Loading... } @if (treeNode && treeNode.isAlbum) {
    <app-photos-section
      [gAlbumId]="treeNode.albumId"
      [gAlbumLink]="treeNode.albumGooglePhotosLink"
    />
    }
  </nb-layout-column>
</nb-layout>
